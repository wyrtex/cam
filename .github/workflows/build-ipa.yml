name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Cam.xcodeproj \
            -scheme Cam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "=== ERRORS ==="; grep -E "error:" build.log | sort -u | head -60
              echo "=== TAIL ==="; tail -n 40 build.log
              exit 1
            }
          tail -n 5 build.log

      - name: Package IPA
        run: |
          rm -rf Payload Cam.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Cam.app Payload/
          zip -qry Cam.ipa Payload
          ls -lh Cam.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cam-ipa
          path: Cam.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
