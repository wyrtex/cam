name: Cam
options:
  bundleIdPrefix: com.wyrtex
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Cam:
    type: application
    platform: iOS
    sources:
      - path: Cam/Sources
      - path: Cam/Resources
      - path: Cam/Shared
    dependencies:
      - target: CamControls
      - target: CamCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyrtex.cam
        PRODUCT_NAME: Cam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cam/Resources/Info.plist
    info:
      path: Cam/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cam Pro
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUserActivityTypes: [com.wyrtex.cam.open]
        NSCameraUsageDescription: Камера нужна для съёмки фото и видео.
        NSMicrophoneUsageDescription: Микрофон нужен для записи звука в видео.
        NSPhotoLibraryAddUsageDescription: Сохранение фото и видео в галерею.
        NSPhotoLibraryUsageDescription: Доступ к галерее для показа последнего снимка.
        NSMotionUsageDescription: Датчики движения нужны для индикатора уровня (горизонт).
  CamControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Cam/ControlsExtension
      - path: Cam/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyrtex.cam.controls
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cam/ControlsExtension/Info.plist
    info:
      path: Cam/ControlsExtension/Info.plist
      properties:
        CFBundleDisplayName: Cam Pro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CamCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Cam/CaptureExtension
      - path: Cam/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyrtex.cam.capture
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cam/CaptureExtension/Info.plist
    info:
      path: Cam/CaptureExtension/Info.plist
      properties:
        CFBundleDisplayName: Cam Pro
        NSCameraUsageDescription: Камера нужна для съёмки фото и видео.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.securecapture
